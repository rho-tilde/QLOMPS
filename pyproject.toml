[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlomps"
version = "0.1.0"
description = "Circuit and optimizer code for QLOMPS hardware experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "qiskit>=2.4,<3",
  "qiskit-ibm-runtime>=0.46,<1",
]

[project.optional-dependencies]
ibm-exact-parser = [
  "pytket>=2",
  "pytket-qiskit>=0.70",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["IBM"]

[tool.pytest.ini_options]
testpaths = ["IBM/tests"]

