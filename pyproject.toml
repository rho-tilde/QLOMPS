[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlomps"
version = "0.1.0"
description = "Circuit and optimizer code for QLOMPS hardware experiments"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "numpy>=1.24",
  "qiskit>=2.4,<3",
  "qiskit-ibm-runtime>=0.46,<1",
]

[project.optional-dependencies]
ibm-exact-parser = [
  "pytket>=2",
  "pytket-qiskit>=0.70",
]
quantinuum = [
  "qnexus",
  "pytket>=2",
  "pytket-quantinuum",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["IBM", "Quantinuum"]

[tool.pytest.ini_options]
testpaths = ["IBM/tests", "Quantinuum/tests"]
